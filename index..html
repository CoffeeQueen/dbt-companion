function setTheme(mode){if(mode!=="dark")mode="light";document.documentElement.dataset.theme=mode;try{localStorage.setItem("dbt-companion-theme",mode)}catch(e){};document.getElementById("light-theme").setAttribute("aria-pressed",String(mode==="light"));document.getElementById("dark-theme").setAttribute("aria-pressed",String(mode==="dark"));const wheel=document.querySelector(".wheel-frame");if(wheel){wheel.outerHTML=wheelMarkup().match(/<div class="wheel-frame">[\s\S]*?<\/div>/)[0];}}
try{setTheme(localStorage.getItem("dbt-companion-theme")||"light")}catch(e){setTheme("light")}

const tabs=['Home','Start Here','Privacy & Data','Help Me Now','Skills','Chain Analysis','Diary Card','My Saved Work','Journal','Reflection Jar','About DBT'];let tab='Home';const emotionGroups={'Anger':['Annoyed','Irritated','Frustrated','Resentful','Bitter','Furious','Enraged','Indignant','Jealous','Hostile'],'Sadness':['Sad','Disappointed','Hurt','Lonely','Grieving','Hopeless','Discouraged','Rejected','Empty','Heartbroken'],'Fear':['Anxious','Worried','Nervous','Scared','Panicked','Insecure','Overwhelmed','Dread','Vulnerable','Uneasy'],'Shame & guilt':['Ashamed','Guilty','Embarrassed','Humiliated','Regretful','Self-conscious','Remorseful'],'Joy & connection':['Happy','Excited','Grateful','Proud','Loved','Hopeful','Peaceful','Content','Relieved','Playful','Confident'],'Other feelings':['Confused','Surprised','Numb','Bored','Disgusted','Curious','Exhausted','Restless','Apathetic','Tender','Amazed']};let selectedEmotions=[],emotionIntensities={},customEmotion='',emotionView='wheel',emotionCategory='Anger',emotionSearch='';
const darkEmotionColors={'Anger':'#c96c48','Sadness':'#438db7','Fear':'#9270c0','Shame & guilt':'#ba6895','Joy & connection':'#c69f35','Other feelings':'#389f89'};
const emotionColors={'Anger':'#f77d48','Sadness':'#56b5ef','Fear':'#b990e9','Shame & guilt':'#ed87b1','Joy & connection':'#f6ca37','Other feelings':'#50d5b0'};
function wheelPath(cx,cy,r1,r2,a1,a2){const xy=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];let p1=xy(r2,a1),p2=xy(r2,a2),p3=xy(r1,a2),p4=xy(r1,a1);return `M${p1} A${r2} ${r2} 0 ${a2-a1>Math.PI?1:0} 1 ${p2} L${p3} A${r1} ${r1} 0 ${a2-a1>Math.PI?1:0} 0 ${p4} Z`}
function wheelMarkup(){let cats=Object.keys(emotionGroups),cx=190,cy=190;return `<div class="wheel-frame"><svg viewBox="0 0 380 380" role="group" aria-label="Interactive feelings wheel. Select a category to explore emotions.">${cats.map((cat,i)=>{let a1=-Math.PI/2+i*2*Math.PI/cats.length,a2=a1+2*Math.PI/cats.length,mid=(a1+a2)/2,tx=cx+123*Math.cos(mid),ty=cy+123*Math.sin(mid);return `<g><path tabindex="0" role="button" aria-label="Explore ${cat}" class="wheel-slice" fill="${document.documentElement.dataset.theme==='dark'?darkEmotionColors[cat]:emotionColors[cat]}" d="${wheelPath(cx,cy,57,177,a1,a2)}" onclick="pickCategory('${cat}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pickCategory('${cat}')}"><title>${cat}</title></path><text class="wheel-label" x="${tx}" y="${ty}" text-anchor="middle">${cat==='Joy & connection'?'Joy':cat==='Shame & guilt'?'Shame':cat==='Other feelings'?'Other':cat}</text></g>`}).join('')}<circle cx="190" cy="190" r="55" fill="#fffaf0" stroke="#fff" stroke-width="4"/><text x="190" y="185" text-anchor="middle" class="wheel-center">What am I</text><text x="190" y="202" text-anchor="middle" class="wheel-center">feeling?</text></svg></div><p class="emotion-help">Tap a colored section, then choose the specific feelings that fit. You can choose from several categories.</p>`}
function emotionMarkup(){return `<div class="emotion-group"><h3>Explore your feelings</h3><p class="emotion-help">There are no wrong feelings. Select more than one and rate each one from 0 to 10.</p><div class="emotion-toolbar"><button type="button" class="${emotionView==='wheel'?'primary':''}" onclick="switchEmotionView('wheel')">◉ Feelings wheel</button><button type="button" class="${emotionView==='list'?'primary':''}" onclick="switchEmotionView('list')">☷ Searchable list</button></div><div id="emotionBrowser">${emotionBrowserMarkup()}</div><div id="emotionSelections">${selectedEmotionMarkup()}</div><label for="customEmotion">Don't see your feeling? Add your own</label><div style="display:flex;gap:8px"><input id="customEmotion" placeholder="Another feeling..." value="${escapeHTML(customEmotion)}" oninput="customEmotion=this.value"><button type="button" onclick="addCustomEmotion()">Add</button></div></div>`}
function emotionBrowserMarkup(){if(emotionView==='wheel')return wheelMarkup()+categoryMarkup();return `<label for="emotionSearch">Search all feelings</label><input id="emotionSearch" placeholder="Try: resentful, hopeful, overwhelmed..." value="${escapeHTML(emotionSearch)}" oninput="emotionSearch=this.value;updateEmotionList()"><div id="emotionList">${emotionListMarkup()}</div>`}
function categoryMarkup(){return `<h3>${escapeHTML(emotionCategory)}</h3><div>${emotionGroups[emotionCategory].map(word=>emotionChoiceMarkup(word)).join('')}</div>`}
function emotionListMarkup(){let q=emotionSearch.trim().toLowerCase();let words=Object.entries(emotionGroups).flatMap(([cat,ws])=>ws.filter(w=>!q||w.toLowerCase().includes(q)||cat.toLowerCase().includes(q)));return words.length?words.map(emotionChoiceMarkup).join(''):'<p>No matches. You can add your own feeling below.</p>'}
function emotionChoiceMarkup(word){let active=selectedEmotions.includes(word);return `<div class="emotion-choice ${active?'selected':''}"><button type="button" aria-pressed="${active}" onclick="toggleEmotion('${word.replace(/'/g,"\'")}')">${active?'✓ ': '+ '}${escapeHTML(word)}</button>${active?`<label style="margin:0;font-size:13px" for="int-${word.replace(/[^a-zA-Z]/g,'')}">Intensity <input aria-label="${escapeHTML(word)} intensity from 0 to 10" id="int-${word.replace(/[^a-zA-Z]/g,'')}" type="number" min="0" max="10" value="${emotionIntensities[word]??5}" onchange="setEmotionIntensity('${word.replace(/'/g,"\'")}',this.value)"></label>`:''}</div>`}
function selectedEmotionMarkup(){return `<h3>My selected feelings (${selectedEmotions.length})</h3>${selectedEmotions.length?selectedEmotions.map(word=>`<span class="emotion-pill">${escapeHTML(word)} · ${emotionIntensities[word]??5}/10 <button type="button" aria-label="Remove ${escapeHTML(word)}" onclick="toggleEmotion('${word.replace(/'/g,"\'")}')">×</button></span>`).join(''):'<p class="emotion-help">No feelings selected yet.</p>'}`}
function updateEmotionBrowser(){let b=document.getElementById('emotionBrowser');if(b)b.innerHTML=emotionBrowserMarkup();let t=document.getElementById('emotionSelections');if(t)t.innerHTML=selectedEmotionMarkup()}
function switchEmotionView(view){emotionView=view;let host=document.querySelector('.emotion-group');if(host)host.outerHTML=emotionMarkup()}
function pickCategory(cat){emotionCategory=cat;updateEmotionBrowser()}
function updateEmotionList(){let e=document.getElementById('emotionList');if(e)e.innerHTML=emotionListMarkup()}
function toggleEmotion(word){if(selectedEmotions.includes(word))selectedEmotions=selectedEmotions.filter(w=>w!==word);else{selectedEmotions.push(word);emotionIntensities[word]=5}updateEmotionBrowser()}
function setEmotionIntensity(word,value){emotionIntensities[word]=Math.max(0,Math.min(10,Number(value)||0));let t=document.getElementById('emotionSelections');if(t)t.innerHTML=selectedEmotionMarkup()}
function addCustomEmotion(){let word=customEmotion.trim().slice(0,50);if(!word)return;if(!selectedEmotions.includes(word)){selectedEmotions.push(word);emotionIntensities[word]=5}customEmotion='';let el=document.getElementById('customEmotion');if(el)el.value='';updateEmotionBrowser()}
function updateEmotions(){updateEmotionBrowser()}
const content=document.getElementById('content'),nav=document.getElementById('nav');const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(t){if(tab==='Chain Analysis')saveChainField();tab=t;render();window.scrollTo(0,0)}function render(){nav.innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let html='';if(tab==='Start Here')html=welcomeGuideMarkup();if(tab==='Privacy & Data')html=privacyGuideMarkup();if(tab==='Home')html=`<h2>Welcome</h2><div class="card"><span class="tag">Start here</span><h2>What do you need today?</h2><p>You don't have to figure everything out at once.</p><button class="primary" onclick="go('Help Me Now')">I need help right now</button> <button onclick="go('Diary Card')">Daily check-in</button></div><div class="card"><h3>Practice, not perfection</h3><p>DBT is about building skills over time. A hard moment doesn't erase your progress.</p></div>`;if(tab==='Help Me Now')html=`<h2>Help Me Now</h2><p>Tap the STOP sign to practice, one step at a time.</p>${stopMarkup()}<div class="card"><h3>Grounding: 5–4–3–2–1</h3><p>Name 5 things you see, 4 you feel, 3 you hear, 2 you smell, and 1 you taste. Adapt or skip senses that aren't comfortable.</p></div><div class="card"><h3>Temperature and paced breathing</h3><p>Try cool water on your hands or face and a gentle, slower exhale. Avoid extreme temperatures or breath-holding if medically unsafe for you.</p></div>`;if(tab==='Skills')html=`<h2>DBT Skills Library</h2><p>Tap a module to explore its purpose, skills, and ways to practice.</p>${skillModules.map(m=>`<details class="skill-module"><summary>${m.icon} ${m.name}</summary><div class="skill-body"><p><b>What it is:</b> ${m.what}</p><p><b>Goal:</b> ${m.goal}</p>${m.skills.map(sk=>sk[0]==='PLEASE'?pleaseMarkup():skillAcronyms[sk[0]]?acronymMarkup(sk[0]):`<h4>${sk[0]}</h4><p>${sk[1]}</p>`).join('')}${m.name==='Distress Tolerance'?'<button class="primary" onclick="go(\'Help Me Now\')">Practice STOP with the stop sign →</button>':''}</div></details>`).join('')}`;if(tab==='Chain Analysis')html=`<h2>Behavior Chain Analysis</h2><p>Explore what happened without blame. Choose the format that works for you.</p><div class="card"><h3>Choose your path</h3><button class="${chainMode==='guided'?'primary':''}" onclick="setChainMode('guided')">Guided Deep Dive</button> <button class="${chainMode==='quick'?'primary':''}" onclick="setChainMode('quick')">Quick Worksheet</button></div>${chainMode==='guided'?guidedMarkup():quickMarkup()}`;if(tab==='My Saved Work')html=savedWorkMarkup();if(tab==='Diary Card')html=diaryMarkup();if(tab==='Reflection Jar')html=`<h2>Reflection Jar</h2><p>Draw a card, share what it means to you, and choose something to practice this week.</p><div class="jar-stage"><svg class="mason-jar" viewBox="0 0 260 295" role="img" aria-label="Mason jar filled with colorful reflection cards"><rect x="62" y="15" width="136" height="24" rx="6" fill="#a6e4e5" stroke="#396b85" stroke-width="5"/><path d="M65 39 L65 62 Q39 73 39 106 L39 239 Q39 277 77 277 L183 277 Q221 277 221 239 L221 106 Q221 73 195 62 L195 39 Z" fill="#e6fbff88" stroke="#3d8b9b" stroke-width="6"/><g transform="rotate(-13 96 156)"><rect x="63" y="120" width="67" height="93" rx="8" fill="#ffcc59" stroke="#e59a34" stroke-width="3"/></g><g transform="rotate(15 167 164)"><rect x="133" y="117" width="65" height="96" rx="8" fill="#fa7ca4" stroke="#d64f7e" stroke-width="3"/></g><g transform="rotate(-2 132 190)"><rect x="103" y="147" width="66" height="100" rx="8" fill="#a985f5" stroke="#8052b8" stroke-width="3"/></g><path d="M55 92 Q130 68 206 92" fill="none" stroke="#fff" stroke-width="7" opacity=".65"/><text x="130" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#316c7b">REFLECT</text></svg><button class="jar-draw" onclick="drawCard()">✦ Draw a card</button></div><div class="jar-card" style="text-align:center" aria-live="polite"><span class="tag" id="cardcategory">Reflection</span><h2 id="cardtext">Your next reflection is waiting.</h2><p id="cardhint">Draw a card to begin.</p></div><div class="jar-controls"><button onclick="flipCard()">↻ Flip card</button></div><label for="shareMeaning">What does this card mean to you right now?</label><textarea id="shareMeaning" placeholder="What would you share with your group?"></textarea><label for="focus">What would you like to work on this week?</label><textarea id="focus" placeholder="One small step I can practice..."></textarea><p><button class="primary" onclick="downloadReflection()">Download my reflection</button></p><small>Original prompts inspired by group reflection activities. Your answers are not automatically saved.</small>`;if(tab==='About DBT')html=`<h2>About DBT</h2><div class="card"><span class="tag">The origins</span><h3>Meet Dr. Marsha M. Linehan</h3><p>Psychologist Dr. Marsha M. Linehan developed Dialectical Behavior Therapy (DBT). DBT combines acceptance and change: you can acknowledge your experience as it is while learning ways to respond differently.</p><p>DBT was originally developed for people experiencing chronic suicidality and intense emotional distress. Its skills are now taught in a range of settings.</p></div><div class="card"><h3>What does “dialectical” mean?</h3><p>Two things that seem opposite can both be true. For example: “My feelings make sense, and I can choose how I respond.”</p></div><div class="card"><h3>Learn DBT in everyday language</h3><p>Our beginner questions explain DBT terms as you go. Experienced learners can use familiar worksheet wording instead. Switch at any time.</p><p><small>This is an independent educational app, not affiliated with or endorsed by Dr. Linehan or her organizations. Our explanations and reflection cards are original, not reproductions of published DBT worksheets.</small></p></div>`;if(tab==='Journal')html=`<h2>My Journal</h2><p>Write freely. Entries aren't stored in the app yet; download them to keep them.</p><label for="journal">Today's reflection</label><textarea id="journal" style="min-height:210px" placeholder="What's on your mind?"></textarea><p><button class="primary" onclick="downloadJournal()">Download entry</button></p>`;content.innerHTML=html;if(tab==='Diary Card'){}}function welcomeGuideMarkup(){return `<h2>Welcome to DBT Companion</h2><p>A friendly place to learn and practice DBT skills at your own pace. You do not need to know DBT to begin.</p><div class="card guide-green"><span class="tag">Start here</span><h3>What is DBT?</h3><p>Dialectical Behavior Therapy teaches practical ways to notice what is happening, cope with distress, understand emotions, and communicate more effectively. It balances acceptance with change: your experience matters, and you can practice a different response.</p><p>This app is a self-help learning tool, not therapy or emergency monitoring.</p></div><div class="card guide-berry"><h3>Four skill families</h3><p><b>Mindfulness:</b> Notice the present moment without immediately judging it.</p><p><b>Distress tolerance:</b> Get through difficult moments without making them worse.</p><p><b>Emotion regulation:</b> Understand feelings and make choices about how to respond.</p><p><b>Interpersonal effectiveness:</b> Ask for what you need and maintain relationships and self-respect.</p><button onclick="go('Skills')">Explore the skills →</button></div><div class="card guide-teal"><h3>Words you'll see in the Diary Card</h3><p><b>Emotion:</b> What you feel, such as anger, fear, shame, or joy.</p><p><b>Thought:</b> Words or ideas going through your mind, such as “They don't understand me.”</p><p><b>Urge:</b> Something you feel pulled to do, whether or not you act on it.</p><p><b>Behavior:</b> Something you actually did or said, such as walking away or raising your voice.</p><p><b>Skill:</b> A strategy you practiced, even if it didn't work perfectly.</p><p>These can overlap. The point is curiosity and learning, not getting every label perfect.</p></div><div class="card guide-red"><h3>Your first five minutes</h3><ol><li>Open <b>Skills</b> and explore one skill that sounds useful.</li><li>Try <b>Help Me Now</b> for a guided STOP practice when you want to pause.</li><li>Open <b>Diary Card</b>, select a day, and record what you want to track.</li><li>Mark skills on the checklist, then see the <b>Weekly Review</b>.</li><li>Save your work and download a private copy if you want to keep it.</li></ol><p>You can skip any question. You don't need to complete the whole diary every day.</p><button class="primary" onclick="go('Diary Card')">Try the Diary Card →</button></div><div class="card"><h3>Before you write personal details</h3><p>Your saved work stays in this browser on this device, where other people with access to the device or browser files may be able to see it. It is not encrypted or automatically backed up.</p><button onclick="go('Privacy & Data')">Read privacy and backup information →</button></div>`}
function privacyGuideMarkup(){return `<h2>Privacy & Your Data</h2><p>Understand how this prototype handles your entries before recording personal information.</p><div class="card guide-green"><h3>What stays on your device?</h3><p>Saved diary weeks, practice drafts, and some app preferences use this browser's local storage. This prototype has no account system and does not automatically send those entries to the app creator, your therapist, or group members.</p><p><b>Important:</b> Browser storage is not encryption. Anyone with access to your unlocked device or its files may be able to read your entries.</p></div><div class="card guide-berry"><h3>Saving and downloading are different</h3><p><b>Save:</b> Keeps an entry in the current browser's local storage. Clearing browser data, changing browsers, or opening a different copy of this local HTML file can make saved work unavailable.</p><p><b>Download:</b> Creates a separate file you can keep. Downloads may contain sensitive details in readable text; store them privately and avoid sharing them accidentally.</p><p>This version does not offer automatic cloud backup or an import/restore tool. Downloaded files do not automatically reappear inside the app.</p><button onclick="go('My Saved Work')">Open My Saved Work →</button></div><div class="card guide-teal"><h3>Before sharing the app</h3><p>Share a <b>clean copy of the app ZIP</b>, not your completed diary downloads or screenshots. The app file itself does not include your saved browser entries.</p><p>Each person's browser stores their own work separately. This app does not automatically send diary entries to a therapist, group, or anyone else.</p><p>If you are using a shared phone or computer, consider whether it's safe to enter sensitive information.</p></div><div class="card guide-red"><h3>Safety and support</h3><p>DBT Companion is an independent educational prototype, not professional care, crisis monitoring, or an emergency service. No one is watching entries or responding to them.</p><p>If you are in immediate danger, contact local emergency services. In the United States, you can call or text <b>988</b> for suicide and crisis support.</p><p>You can leave sensitive fields blank and discuss concerns directly with a qualified professional.</p></div><div class="card"><h3>Our promise for the project</h3><p>The goal is to keep DBT Companion free to use. This prototype does not require an account or subscription. Future hosting or distribution would need a fresh privacy review before release.</p></div>`}
const chainQuestions=[
{term:'Identify the target behavior',title:'What did you do that you want to understand?',help:'Describe one specific action, not a judgment about yourself.',example:'I raised my voice during an argument.'},
{term:'Identify the prompting event',title:'What happened just before that?',help:'What could a camera or another observer have noticed?',example:'Someone commented on how I was doing a chore.'},
{term:'Identify vulnerability factors',title:'What made this situation harder for you?',help:'Think about sleep, pain, stress, hunger, earlier experiences, or other factors.',example:'I had been sick and tired all morning.'},
{term:'Trace the links in the chain',title:'What went through your mind?',help:'What did you tell yourself the event meant? Thoughts are interpretations, not necessarily facts.',example:'I thought they believed I was lazy.'},
{term:'Notice feelings, body sensations, and urges',title:'What did you feel, and what did you want to do?',help:'Consider emotions, physical sensations, impulses, and how they changed.',example:'I felt hurt, my shoulders tightened, and I wanted to argue.'},
{term:'Identify consequences',title:'What happened after you responded?',help:'Look at immediate and later effects, for you and others. Include anything that helped.',example:'The argument escalated, and later I felt exhausted.'},
{term:'Identify skillful alternatives and repair',title:'Where might you try something different next time?',help:'Look for a specific point in the chain where a DBT skill could help. You can also plan a repair.',example:'I could use STOP before speaking, then describe what I need.'}
];let chainMode='guided',chainLanguage='beginner',chainStep=0;let chainAnswers=Array(chainQuestions.length).fill('');let chainDrafts={};let activeChainId=null;try{chainDrafts=JSON.parse(localStorage.getItem('dbt-companion-chains-v11')||'{}')||{}}catch(e){}
function setChainMode(m){saveChainField();chainMode=m;render()}
function setChainLanguage(l){saveChainField();chainLanguage=l;render()}
function saveChainField(){let el=document.getElementById('chainAnswer');if(el)chainAnswers[chainStep]=el.value;let fields=document.querySelectorAll('[data-chain-index]');fields.forEach(el=>chainAnswers[Number(el.dataset.chainIndex)]=el.value)}
function guidedMarkup(){const q=chainQuestions[chainStep];return `<div class="card"><div class="stepheader"><span class="tag">Step ${chainStep+1} of ${chainQuestions.length}</span><span class="muted">Your pace, your choice</span></div><div class="progress"><div style="width:${(chainStep+1)/chainQuestions.length*100}%"></div></div><label for="chainLanguage">Question style</label><select id="chainLanguage" onchange="setChainLanguage(this.value)"><option value="beginner" ${chainLanguage==='beginner'?'selected':''}>New to DBT · everyday language</option><option value="experienced" ${chainLanguage==='experienced'?'selected':''}>Familiar with DBT · clinical terms</option></select><h3>${chainLanguage==='beginner'?q.title:q.term}</h3><p>${chainLanguage==='beginner'?q.help:q.title+' '+q.help}</p>${chainLanguage==='beginner'?`<p class="term">DBT term: <b>${q.term}</b></p>`:''}<details><summary>Show an example</summary><p>${q.example}</p></details><label for="chainAnswer">Your response</label><textarea id="chainAnswer" placeholder="Take your time. You can leave this blank.">${escapeHTML(chainAnswers[chainStep])}</textarea><div class="stepbuttons"><button onclick="chainMove(-1)" ${chainStep===0?'disabled':''}>← Back</button>${chainStep<chainQuestions.length-1?'<button class="primary" onclick="chainMove(1)">Next →</button>':'<button class="primary" onclick="saveChainField();downloadChain()">Download my analysis</button>'}</div>${chainActionsMarkup()}</div>`}
function quickMarkup(){return `<div class="card"><p>Use the familiar DBT terms, or tap Guided Deep Dive for one question at a time.</p>${chainQuestions.map((q,i)=>`<label for="chainq${i}">${q.term}</label><textarea id="chainq${i}" data-chain-index="${i}">${escapeHTML(chainAnswers[i])}</textarea>`).join('')}${chainActionsMarkup()}</div>`}
function chainActionsMarkup(){return `<div class="card"><h3>Keep your chain analysis</h3><p>Save a browser draft, download a text file, or review your complete chain and receive gentle self-check prompts.</p><button class="primary" onclick="saveChainDraft()">Save analysis in browser</button> <button onclick="downloadChain()">Download analysis</button> <button onclick="reviewChain()">Review my chain</button><p class="muted"><small>Browser drafts are not backed up or encrypted. Download important work.</small></p></div>`}
function saveChainDraft(){saveChainField();try{if(!activeChainId)activeChainId='chain-'+Date.now();chainDrafts[activeChainId]={answers:[...chainAnswers],updated:new Date().toISOString(),mode:chainMode,language:chainLanguage};localStorage.setItem('dbt-companion-chains-v11',JSON.stringify(chainDrafts));if(!JSON.parse(localStorage.getItem('dbt-companion-chains-v11')||'{}')[activeChainId])throw Error('Verification failed');showSaveToast('✓ Chain analysis saved! Find it under My Saved Work.')}catch(e){showSaveToast('Could not save this analysis. Please download a copy.',true)}}
function openSavedChain(id){const item=chainDrafts[id];if(!item)return;activeChainId=id;chainAnswers=chainQuestions.map((_,i)=>String(item.answers?.[i]||''));chainMode=item.mode||'guided';chainLanguage=item.language||'beginner';chainStep=0;go('Chain Analysis')}
function deleteSavedChain(id){if(!confirm('Delete this chain analysis draft? Download a copy first if needed.'))return;try{delete chainDrafts[id];localStorage.setItem('dbt-companion-chains-v11',JSON.stringify(chainDrafts));render();showSaveToast('Chain analysis draft deleted.')}catch(e){showSaveToast('Could not delete this draft.',true)}}
function downloadSavedChain(id){let item=chainDrafts[id];if(!item)return;downloadText('dbt-chain-'+id+'.txt',chainExport(item.answers,item.updated));showSaveToast('Download requested. If your browser asks, confirm Download, then check your Downloads folder.')}
function chainExport(answers,date){return 'DBT Companion | Behavior Chain Analysis\nDate: '+new Date(date||Date.now()).toLocaleString()+'\n\n'+chainQuestions.map((q,i)=>(i+1)+'. '+q.term+'\n'+q.title+'\n'+(answers[i]||'[Not answered]')).join('\n\n')+'\n\nSelf-reflection tool; not a clinical assessment.'}
function reviewChain(){saveChainField();const answered=chainAnswers.filter(x=>x.trim()).length;const missing=chainQuestions.map((q,i)=>!chainAnswers[i].trim()?q.title:null).filter(Boolean);const feedback=missing.length?'<p><b>Questions you may want to explore:</b></p><ul>'+missing.map(x=>'<li>'+escapeHTML(x)+'</li>').join('')+'</ul>':'<p>You wrote something for every step. You can still revisit any part of the chain.</p>';const panel=`<div class="card" id="chain-review"><h3>Review your chain</h3><p>${answered} of ${chainQuestions.length} steps have responses. This is a completeness check, not an evaluation of your experience.</p>${feedback}${chainQuestions.map((q,i)=>`<h4>${i+1}. ${escapeHTML(q.title)}</h4><p style="white-space:pre-wrap">${escapeHTML(chainAnswers[i]||'Not answered yet')}</p>`).join('')}<button class="primary" onclick="saveChainDraft()">Save this analysis</button> <button onclick="downloadChain()">Download</button> <button onclick="render()">Back to questions</button></div>`;document.getElementById('content').innerHTML=`<h2>Behavior Chain Analysis</h2>${panel}`;document.getElementById('chain-review').scrollIntoView({block:'start'})}
function chainMove(direction){saveChainField();chainStep=Math.max(0,Math.min(chainQuestions.length-1,chainStep+direction));render();document.querySelector('#content').scrollIntoView({behavior:'smooth',block:'start'})}
const skillModules=[
{icon:'🌿',name:'Mindfulness',what:'Pay attention to this moment with awareness, rather than running on autopilot.',goal:'Notice what is happening and choose your response.',skills:[['Observe, Describe, Participate','Notice what you experience; put words to it; engage fully in what you are doing.'],['Nonjudgmentally','Notice facts without labeling yourself or others as good or bad.'],['One-Mindfully','Do one thing at a time, bringing your attention back when it wanders.'],['Effectively','Focus on what works toward your goals instead of winning or being right.']]},
{icon:'🛟',name:'Distress Tolerance',what:'Get through painful moments without making them worse, while learning to accept reality as it is.',goal:'Survive crises safely and make room for difficult realities.',skills:[['STOP','Stop, Take a step back, Observe, Proceed mindfully.'],['TIPP','Temperature, Intense exercise, Paced breathing, Paired muscle relaxation. Adapt techniques to your health and abilities.'],['ACCEPTS and self-soothing','Temporarily shift attention with meaningful activities or comfort your senses safely.'],['Radical acceptance','Acknowledge what is real without saying you approve of it.']]},
{icon:'💛',name:'Emotion Regulation',what:'Understand emotions and influence how you respond to them.',goal:'Reduce avoidable suffering and build a life with more positive experiences.',skills:[['Check the Facts','Separate what you observed from interpretations and assumptions.'],['Opposite Action','When an emotion or urge does not fit the facts or is ineffective, practice a more helpful action.'],['PLEASE','Care for physical health and basic needs in ways that fit your circumstances.'],['Build positive experiences','Make space for small enjoyable activities and long-term goals.']]},
{icon:'🤝',name:'Interpersonal Effectiveness',what:'Communicate clearly, care for relationships, and respect yourself.',goal:'Ask for what you need, maintain relationships, and protect self-respect.',skills:[['DEAR MAN','Describe, Express, Assert, Reinforce; stay Mindful, Appear confident, Negotiate.'],['GIVE','Be Gentle, act Interested, Validate, use an Easy manner.'],['FAST','Be Fair, avoid unnecessary Apologies, Stick to values, be Truthful.'],['Boundaries','Say what you can and cannot do clearly and respectfully.']]}
];
const skillAcronyms={
'TIPP':{intro:'Body-based ways to lower emotional intensity during distress. Choose only techniques that are safe for your health.',parts:[['T','Tip the Temperature','Try comfortably cool water or a cool cloth to help settle yourself. Avoid icy immersion or extreme cold, especially with heart or circulation concerns.'],['I','Intense Exercise','Brief movement can help release energy. Adapt intensity to your abilities; gentle seated movement may be a better option.'],['P','Paced Breathing','Slow your breathing comfortably, perhaps making your exhale a little longer than your inhale. Do not strain or hold your breath.'],['P','Paired Muscle Relaxation','Gently tense and release muscle groups while noticing the difference. Skip painful or injured areas.']],practice:'Which safe option could help you through a difficult moment?'},

let practiceDrafts={};try{practiceDrafts=JSON.parse(localStorage.getItem('dbt-companion-practice-v09')||'{}')||{}}catch(e){}
function practiceKey(name){return 'practice-'+name.replace(/ /g,'-')}

function showSaveToast(message,error=false){const toast=document.getElementById('save-toast');toast.textContent=message;toast.style.background=error?'#a32339':'#165b50';toast.hidden=false;clearTimeout(window.saveToastTimer);window.saveToastTimer=setTimeout(()=>{toast.hidden=true},5000)}
function storePractice(name){capturePractice(name);try{localStorage.setItem('dbt-companion-practice-v09',JSON.stringify(practiceDrafts));const stored=JSON.parse(localStorage.getItem('dbt-companion-practice-v09')||'{}');if(stored[name]!==practiceDrafts[name])throw Error('Storage verification failed');let meta={};try{meta=JSON.parse(localStorage.getItem('dbt-companion-practice-dates')||'{}')||{}}catch(e){}meta[name]=new Date().toISOString();localStorage.setItem('dbt-companion-practice-dates',JSON.stringify(meta));practiceStatus(name,'✓ Saved in this browser. This did NOT create a file. Use Download response for a copy in Downloads.');showSaveToast('✓ Saved! Find this draft under My Saved Work. Download response creates a phone file.')}catch(e){practiceStatus(name,'Could not save in this browser. Use Download response instead.');showSaveToast('Could not save here. Tap Download response instead.',true)}}
function chainSavedCards(){return Object.entries(chainDrafts).sort((a,b)=>(b[1].updated||'').localeCompare(a[1].updated||'')).map(([id,item])=>{const summary=(item.answers||[]).find(x=>x&&x.trim())||'No responses yet';return `<div class="card"><h3>Behavior Chain Analysis</h3><p class="muted">${escapeHTML(new Date(item.updated).toLocaleString())}</p><p>${escapeHTML(summary.slice(0,180))}</p><button class="primary" onclick="openSavedChain('${id}')">Open & edit</button> <button onclick="downloadSavedChain('${id}')">Download</button> <button onclick="deleteSavedChain('${id}')">Delete</button></div>`}).join('')}
function savedWorkMarkup(){let meta={};try{meta=JSON.parse(localStorage.getItem('dbt-companion-practice-dates')||'{}')||{}}catch(e){}const names=Object.keys(practiceDrafts).filter(n=>typeof practiceDrafts[n]==='string'&&practiceDrafts[n].trim()).sort((a,b)=>(meta[b]||'').localeCompare(meta[a]||''));return `<h2>My Saved Work</h2><div class="card"><p>These are practice drafts stored inside this browser, not files in your Downloads folder. Open a draft to keep editing, or download a copy to your phone.</p><p><strong>Important:</strong> Browser drafts are not encrypted or backed up. Clearing browser data, changing browsers, or opening a different local app copy may make them unavailable. Download anything important.</p></div>${chainSavedCards()}${diarySavedCards()}${names.length?names.map(n=>`<div class="card"><h3>${escapeHTML(n)} practice</h3><p class="muted">${meta[n]?escapeHTML(new Date(meta[n]).toLocaleString()):'Saved previously'}</p><p>${escapeHTML(practiceDrafts[n].slice(0,160))}${practiceDrafts[n].length>160?'…':''}</p><button class="primary" onclick="openSavedPractice('${n}')">Open & edit</button> <button onclick="downloadSavedPractice('${n}')">Download</button> <button onclick="deleteSavedPractice('${n}')">Delete</button></div>`).join(''):'<div class="card"><h3>No saved drafts yet</h3><p>Go to Skills, open DEAR MAN, GIVE, FAST, or TIPP, write a response, and tap Save draft in browser. It will appear here if browser storage is available.</p><button class="primary" onclick="go(\'Skills\')">Go to Skills</button></div>'}`}
function openSavedPractice(name){go('Skills');let module=name==='TIPP'?'Distress Tolerance':'Interpersonal Effectiveness';const m=Array.from(document.querySelectorAll('.skill-module')).find(e=>e.querySelector('summary')?.textContent.includes(module));if(m){m.open=true;const a=Array.from(m.querySelectorAll('.please-skill')).find(e=>e.querySelector('summary')?.textContent.includes(name));if(a){a.open=true;const practice=Array.from(a.querySelectorAll('.please-part')).find(e=>e.querySelector('summary')?.textContent.includes('Try it yourself'));if(practice)practice.open=true;setTimeout(()=>document.getElementById(practiceKey(name))?.scrollIntoView({block:'center',behavior:'smooth'}),30)}}}
function downloadSavedPractice(name){const response=practiceDrafts[name]||'';downloadText('dbt-'+name.toLowerCase().replace(/ /g,'-')+'-saved.txt','DBT Companion | '+name+' saved practice\n\nPrompt: '+skillAcronyms[name].practice+'\n\nMy response:\n'+response+'\n\nThis is a saved browser draft exported to a text file.');showSaveToast('Download requested. If your browser asks, confirm Download, then check your Downloads folder.')}
function deleteSavedPractice(name){if(!confirm('Delete your '+name+' draft from this browser? Download a copy first if you want to keep it.'))return;delete practiceDrafts[name];try{localStorage.setItem('dbt-companion-practice-v09',JSON.stringify(practiceDrafts));let meta=JSON.parse(localStorage.getItem('dbt-companion-practice-dates')||'{}');delete meta[name];localStorage.setItem('dbt-companion-practice-dates',JSON.stringify(meta));showSaveToast('Draft deleted from this browser.');render()}catch(e){showSaveToast('Could not delete draft in this browser.',true)}}
function practiceStatus(name,msg){const el=document.getElementById('practice-status-'+name.replace(/ /g,'-'));if(el)el.textContent=msg}
function exportPractice(name){capturePractice(name);const response=practiceDrafts[name]||'';const items=practiceChecks[name]||[];const checked=items.filter((_,i)=>document.getElementById('review-'+name.replace(/ /g,'-')+'-'+i)?.checked).map(x=>x[0]);downloadText('dbt-'+name.toLowerCase().replace(/ /g,'-')+'-'+new Date().toISOString().slice(0,10)+'.txt','DBT Companion | '+name+' practice\nDate: '+new Date().toLocaleString()+'\n\nPrompt: '+skillAcronyms[name].practice+'\n\nMy response:\n'+response+'\n\nSelf-review items I checked: '+(checked.join(', ')||'None yet')+'\n\nExample:\n'+practiceExamples[name]+'\n\nSelf-review is not a clinical evaluation.');practiceStatus(name,'Download requested. Check your Downloads folder or browser download prompt.');showSaveToast('Download requested — check your browser or Downloads folder.')}
function reviewPractice(name){capturePractice(name);const id=name.replace(/ /g,'-'),answer=(practiceDrafts[name]||'').trim(),checks=practiceChecks[name],chosen=checks.filter((_,i)=>document.getElementById('review-'+id+'-'+i)?.checked),missing=checks.filter((_,i)=>!document.getElementById('review-'+id+'-'+i)?.checked);const el=document.getElementById('feedback-'+id);if(!answer){el.innerHTML='<p>Please write a response first so you have something to reflect on.</p>';return}el.innerHTML='<h4>Your guided self-review</h4><p><b>Areas you identified:</b> '+(chosen.map(x=>escapeHTML(x[0])).join(', ')||'None selected yet')+'.</p><p><b>Consider next:</b> '+(missing.length?missing.map(x=>escapeHTML(x[1])).join(' '):'You checked every element. Reread your response and see whether each element is actually present.')+'</p><p><small>These are prompts based on your own checklist choices. The app cannot verify that your writing demonstrates a skill or assess your situation.</small></p>';}
function pleaseMarkup(){const parts=[['PL','Treat Physical Illness','Attend to health needs, medications as prescribed, and symptoms. Ask for medical support when needed.'],['E','Balance Eating','Eat regularly and in ways that work for your health, resources, and individual needs.'],['A','Avoid Mood-Altering Substances','Notice how alcohol, drugs, and other substances may affect mood and choices. Seek support if changing use is difficult.'],['S','Balance Sleep','Aim for a sustainable sleep routine and enough rest for your circumstances.'],['E','Get Exercise','Choose safe, accessible movement that fits your body and abilities; small amounts count.']];return `<details class="please-skill"><summary>💛 PLEASE — care for your body and emotions</summary><div class="please-inner"><p>PLEASE is an Emotion Regulation skill for reducing vulnerability to intense emotions. Tap each letter to see what it means.</p>${parts.map(([letter,title,description])=>`<details class="please-part"><summary><span class="please-letter">${letter}</span> ${title}</summary><p>${description}</p></details>`).join('')}<p class="muted"><small>The acronym is traditionally written PL–E–A–S–E. Adapt these suggestions to your health and circumstances.</small></p></div></details>`}

function acronymMarkup(name){const a=skillAcronyms[name],id=name.replace(/ /g,'-');return `<details class="please-skill"><summary>✨ ${name} — tap to explore each letter</summary><div class="please-inner"><p>${a.intro}</p>${a.parts.map(([letter,title,description])=>`<details class="please-part"><summary><span class="please-letter">${letter}</span> ${title}</summary><p>${description}</p></details>`).join('')}<details class="please-part"><summary>✏️ Try it yourself · save and review</summary><div style="padding:12px"><p>${a.practice}</p><label for="practice-${id}">Your practice response</label><textarea id="practice-${id}" placeholder="Write your response here...">${escapeHTML(practiceDrafts[name]||'')}</textarea><div class="stepbuttons" style="flex-wrap:wrap"><button type="button" onclick="storePractice('${name}')">Save draft in browser</button><button type="button" onclick="exportPractice('${name}')">Download response</button></div><details style="margin-top:12px"><summary>Show me an example</summary><p>${escapeHTML(practiceExamples[name])}</p></details><h4>Check your response</h4><p class="muted">Mark the parts you believe you've included. This is a self-check, not an automatic evaluation.</p>${practiceChecks[name].map(([title,q],i)=>`<label style="font-weight:normal;display:flex;align-items:flex-start;gap:9px"><input style="width:20px;min-height:20px;flex:none" type="checkbox" id="review-${id}-${i}"><span><b>${title}:</b> ${q}</span></label>`).join('')}<p><button class="primary" type="button" onclick="reviewPractice('${name}')">Review my response</button></p><div id="feedback-${id}" class="term" aria-live="polite"></div><p class="muted" id="practice-status-${id}" aria-live="polite"><small>Find saved drafts under My Saved Work. Browser storage is not encrypted; anyone with access to this browser profile may be able to read it. Download a backup before clearing browser data or switching devices.</small></p></div></details></div></details>`}
// STOP practice steps: defined before the interactive controls use them.
let stopStep = 0;
const stopSteps = [
  ['S', 'Stop', 'Pause. Notice the urge to react, and give yourself a moment before doing anything.'],
  ['T', 'Take a step back', 'Step away if you can, or take a gentle breath. You do not have to decide right now.'],
  ['O', 'Observe', 'Notice what is happening inside you and around you: thoughts, feelings, urges, and facts.'],
  ['P', 'Proceed mindfully', 'Choose what is effective for this moment and consistent with your goals and values.']
];
function stopMarkup(){return `<div class="card"><button class="stop-sign" aria-label="Tap STOP sign to start guided STOP practice" onclick="stopStep=0;updateStop()"><svg viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg"><path d="M78 8 H162 L222 65 V125 L162 182 H78 L18 125 V65 Z" fill="#e62932" stroke="white" stroke-width="8"/><text x="120" y="111" text-anchor="middle" font-size="50" font-weight="900" fill="white">STOP</text></svg></button><p style="text-align:center">Tap the sign to begin.</p><div class="stop-panel" id="stopPanel" aria-live="polite"><b>STOP practice</b><p>When you're ready, tap the sign or Start below.</p><button class="primary" onclick="stopStep=0;updateStop()">Start STOP</button></div></div>`}
function updateStop(){const e=document.getElementById('stopPanel');if(!e)return;const st=stopSteps[stopStep];e.innerHTML=`<p><b>Step ${stopStep+1} of 4</b></p><div class="stop-step"><div class="stop-letter">${st[0]}</div><div><h3>${st[1]}</h3><p>${st[2]}</p></div></div><div class="stepbuttons"><button ${stopStep===0?'disabled':''} onclick="stopStep--;updateStop()">← Back</button><button class="primary" onclick="stopStep=(stopStep+1)%4;updateStop()">${stopStep===3?'Start over':'Next step →'}</button></div>`}
const reflectionCards=[['Self-respect','I can honor my needs while respecting others.','What boundary would make this week easier?'],['Mindfulness','I can notice a feeling without acting on it.','What feeling can I make room for today?'],['Relationships','I can care about someone and still disagree.','Where could I practice both kindness and honesty?'],['Strengths','Small steps are still meaningful steps.','What have I handled better lately?'],['Joy','I can make room for something pleasant today.','What simple activity brings me a little joy?'],['Choice','I do not have to answer every irritation.','When could a pause protect my peace?'],['Acceptance','I can acknowledge reality without approving of it.','What fact am I ready to recognize today?'],['Self-compassion','Learning a skill takes practice, not perfection.','How would I encourage a friend in my situation?']];let currentCard=null,cardFlipped=false;function drawCard(){let next=Math.floor(Math.random()*reflectionCards.length);if(currentCard&&reflectionCards.length>1&&reflectionCards[next]===currentCard)next=(next+1)%reflectionCards.length;currentCard=reflectionCards[next];cardFlipped=false;showCard()}function flipCard(){if(!currentCard){drawCard();return}cardFlipped=!cardFlipped;showCard()}function showCard(){document.getElementById('cardcategory').textContent=currentCard[0];document.getElementById('cardtext').textContent=cardFlipped?currentCard[2]:currentCard[1];document.getElementById('cardhint').textContent=cardFlipped?'Reflection question':'Tap Flip card for your question'}function downloadReflection(){downloadText('dbt-reflection-'+new Date().toISOString().slice(0,10)+'.txt','Card: '+(currentCard?currentCard[1]:'None drawn')+'\nQuestion: '+(currentCard?currentCard[2]:'')+'\nWhat it means to me: '+v('shareMeaning')+'\nMy focus: '+v('focus'))}function downloadText(filename,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function v(id){return document.getElementById(id).value}function downloadChain(){saveChainField();downloadText('dbt-chain-analysis-'+new Date().toISOString().slice(0,10)+'.txt',chainExport(chainAnswers));showSaveToast('Download requested. If your browser asks, confirm Download, then check your Downloads folder.')}function downloadDiary(){downloadText('dbt-diary-'+new Date().toISOString().slice(0,10)+'.txt',`Emotions: ${selectedEmotions.map(w=>w+' ('+(emotionIntensities[w]??5)+'/10)').join(', ')||'Not specified'}\nOverall intensity: ${v('mood')}/10\nSkill: ${v('used')}\nReflection: ${v('note')}`)}function downloadJournal(){downloadText('dbt-journal-'+new Date().toISOString().slice(0,10)+'.txt',v('journal'))}

const diaryFields=[['urgeUse','Urge to use (0–5)'],['alcohol','Alcohol use'],['streetDrugs','Street drug use'],['meds','Prescription medication taken'],['selfHarmUrge','Self-harm urge (0–5)'],['selfHarmAction','Self-harm action'],['suicidalUrge','Suicidal urge (0–5)'],['suicidalAction','Suicidal action'],['otherBehavior','Other behaviors / targets'],['lies','Lies (number)'],['anger','Anger (0–5)'],['fear','Fear (0–5)'],['joy','Joy (0–5)'],['misery','Misery (0–5)'],['pain','Pain (0–5)'],['sadness','Sadness (0–5)'],['shame','Shame (0–5)'],['skillRating','Skills used (0–7)']];

let diaryPage='daily',diaryDay=0,diaryWeek=new Date(),diaryStore={},diaryData=null,diaryShowSensitive=false;
try{diaryStore=JSON.parse(localStorage.getItem('dbt-companion-diary-v14')||'{}')||{}}catch(e){}
function diaryMonday(date){let d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()-(d.getDay()+6)%7);return d}
function diaryWeekKey(){return diaryMonday(diaryWeek).toISOString().slice(0,10)}
function diaryEmpty(){return {days:Array.from({length:7},()=>({})),skills:{},notes:'',beforeAfter:{},updated:''}}
function diaryLoad(){diaryData=JSON.parse(JSON.stringify(diaryStore[diaryWeekKey()]||diaryEmpty()));if(!diaryData.beforeAfter)diaryData.beforeAfter={};for(let i=0;i<7;i++){let m=diaryData.days[i]?.meds;if(m==='Yes'||m==='No'){if(!diaryData.skills['Took medication'])diaryData.skills['Took medication']=Array(7).fill(false);diaryData.skills['Took medication'][i]=m==='Yes'}}}
function diaryDateLabel(){let m=diaryMonday(diaryWeek),e=new Date(m);e.setDate(e.getDate()+6);return m.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+e.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function diaryFieldInput(key,label){let val=diaryData.days[diaryDay][key]??'';const rating=['urgeUse','selfHarmUrge','suicidalUrge','anger','fear','joy','misery','pain','sadness','shame','skillRating'].includes(key);const choice=['alcohol','streetDrugs','meds','selfHarmAction','suicidalAction'].includes(key);let input=rating?`<select onchange="diarySet('${key}',this.value)"><option value="">Not entered</option>${Array.from({length:key==='skillRating'?8:6},(_,i)=>`<option value="${i}" ${String(val)===String(i)?'selected':''}>${i}</option>`).join('')}</select>`:choice?`<select onchange="diarySet('${key}',this.value)"><option value="">Not entered</option><option value="Yes" ${val==='Yes'?'selected':''}>Yes</option><option value="No" ${val==='No'?'selected':''}>No</option></select>`:key==='lies'?`<input type="number" min="0" value="${escapeHTML(val)}" oninput="diarySet('${key}',this.value)">`:`<input value="${escapeHTML(val)}" oninput="diarySet('${key}',this.value)">`;return `<div class="diary-field"><label>${escapeHTML(label)}</label>${input}</div>`}
function diarySet(key,value){diaryData.days[diaryDay][key]=value;if(key==='meds'){if(!diaryData.skills['Took medication'])diaryData.skills['Took medication']=Array(7).fill(false);diaryData.skills['Took medication'][diaryDay]=value==='Yes'}diaryAutoSave()}
function diaryAutoSave(){try{diaryData.updated=new Date().toISOString();diaryStore[diaryWeekKey()]=diaryData;localStorage.setItem('dbt-companion-diary-v14',JSON.stringify(diaryStore))}catch(e){showSaveToast('Unable to save diary in this browser. Download a backup.',true)}}
function diarySwitch(page){diaryPage=page;render()}

function diaryShiftWeek(n){diaryWeek=diaryMonday(diaryWeek);diaryWeek.setDate(diaryWeek.getDate()+7*n);diaryLoad();render()}
function diarySetNote(value){diaryData.notes=value;diaryAutoSave()}
function diarySetBefore(key,value){if(!diaryData.beforeAfter[diaryDay])diaryData.beforeAfter[diaryDay]={};diaryData.beforeAfter[diaryDay][key]=value;diaryAutoSave()}
function diarySkillToggle(skill,day,checked){if(!diaryData.skills[skill])diaryData.skills[skill]=Array(7).fill(false);diaryData.skills[skill][day]=checked;if(skill==='Took medication')diaryData.days[day].meds=checked?'Yes':'No';diaryAutoSave()}
function diaryRatingGuide(){return `<div class="diary-rating-guide"><strong>Skills used: what 0–7 means</strong><p>0 = Didn't think of a skill<br>1 = Thought of it, didn't want to use it<br>2 = Wanted to use it, but didn't<br>3 = Tried, but couldn't use it<br>4 = Used it, didn't help<br>5 = Used it, helped<br>6 = Used it automatically, didn't help<br>7 = Used it automatically, helped</p></div>`}
function diaryFeelingGuide(){return `<div class="diary-rating-guide"><strong>Feelings and pain: what 0–5 means</strong><p>0 = Not present · 1 = Very mild · 2 = Mild · 3 = Moderate · 4 = Strong · 5 = Very intense. Rate how strongly you felt each emotion today.</p></div>`}
function diaryDailyMarkup(){let core=['anger','fear','joy','misery','pain','sadness','shame','skillRating'];let optional=['urgeUse','alcohol','streetDrugs','meds','selfHarmUrge','selfHarmAction','suicidalUrge','suicidalAction','otherBehavior','lies'];return `<div class="diary-daybar">${diaryDays.map((d,i)=>`<button class="${diaryDay===i?'primary':''}" onclick="diarySelectDay(${i})">${d}</button>`).join('')}</div><div class="card diary-accent-green"><h3>${diaryDays[diaryDay]} — Daily check-in</h3><p>Choose a rating or leave an item blank. Zero is different from not answered.</p><div class="diary-fields">${diaryFeelingGuide()}${core.map(k=>k==='skillRating'?diaryRatingGuide()+diaryFieldInput(k,diaryFields.find(f=>f[0]===k)[1]):diaryFieldInput(k,diaryFields.find(f=>f[0]===k)[1])).join('')}</div></div><div class="card diary-accent-pink"><h3>Optional personal tracking</h3><p>Medication, substance use, urges, actions and personal goals. These are private entries, not judgments.</p><button onclick="diaryShowSensitive=!diaryShowSensitive;render()">${diaryShowSensitive?'Hide':'Show'} optional fields</button>${diaryShowSensitive?`<div class="diary-fields">${optional.map(k=>diaryFieldInput(k,diaryFields.find(f=>f[0]===k)[1])).join('')}</div>`:''}</div><div class="card diary-accent-red"><h3>Before and after</h3><p>Optional ratings or brief notes about urges, emotions, behaviors and thoughts. These reflections apply to the selected day.</p>${['Urge before','Urge after','Emotions before','Emotions after','Behaviors before','Behaviors after','Thoughts before','Thoughts after'].map(k=>`<label>${k}<input value="${escapeHTML(diaryData.beforeAfter[diaryDay]?.[k]??diaryData.beforeAfter[k]??'')}" oninput="diarySetBefore('${k}',this.value)"></label>`).join('')}</div><p><button class="primary" onclick="diarySave()">Save this week</button> <button onclick="diaryDownload()">Download backup</button></p>`}
function diarySkillsMarkup(){return `<p>Mark each day you used a skill. This list is organized into groups for easier phone use.</p>${diarySkills.map(([group,skills])=>`<details class="card diary-skill-group" open><summary><strong>${group}</strong></summary>${skills.map(skill=>`<div class="diary-skill-row"><strong>${escapeHTML(skill)}</strong><div class="diary-checks">${diaryDays.map((d,i)=>`<label><span>${d}</span><input type="checkbox" aria-label="${escapeHTML(skill)} ${d}" ${diaryData.skills[skill]?.[i]?'checked':''} onchange="diarySkillToggle('${skill.replace(/'/g,"\\'")}',${i},this.checked)"></label>`).join('')}</div></div>`).join('')}</details>`).join('')}<p><button class="primary" onclick="diarySave()">Save this week</button> <button onclick="diaryDownload()">Download backup</button></p>`}
function diaryReviewMarkup(){return `<p>This is a compact, scrollable weekly overview based on your two-sided group diary card.</p><div class="diary-table-wrap"><table class="diary-table"><thead><tr><th>Front — daily tracking</th>${diaryDays.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${diaryFields.map(([k,label])=>`<tr><th>${escapeHTML(label)}</th>${diaryDays.map((d,i)=>`<td>${escapeHTML(diaryData.days[i][k]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3>Back — skills used</h3><div class="diary-table-wrap"><table class="diary-table"><thead><tr><th>Skill</th>${diaryDays.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${diarySkills.map(([group,skills])=>skills.map(skill=>`<tr><th>${escapeHTML(skill)}</th>${diaryDays.map((d,i)=>`<td>${diaryData.skills[skill]?.[i]?'✓':'—'}</td>`).join('')}</tr>`).join('')).join('')}</tbody></table></div><h3>Before-and-after reflections</h3><p>Daily reflections you've recorded, including changes in urges, feelings, behaviors and thoughts.</p>${diaryDays.map((d,i)=>{let data=diaryData.beforeAfter[i]||{};if(i===0){for(let k of ['Urge before','Urge after','Emotions before','Emotions after','Behaviors before','Behaviors after','Thoughts before','Thoughts after'])if(data[k]===undefined&&diaryData.beforeAfter[k]!==undefined)data[k]=diaryData.beforeAfter[k]}let entries=Object.entries(data).filter(([k,v])=>typeof v==='string'&&v.trim());return entries.length?`<div class="card"><h4>${d}</h4>${entries.map(([k,v])=>`<p><strong>${escapeHTML(k)}:</strong> ${escapeHTML(v)}</p>`).join('')}</div>`:''}).join('')||'<p>No before-and-after reflections entered yet.</p>'}<label>Notes about the week<textarea oninput="diarySetNote(this.value)" placeholder="Important events, triggers, things you want to discuss in group…">${escapeHTML(diaryData.notes||'')}</textarea></label><p><button class="primary" onclick="diarySave()">Save this week</button> <button onclick="diaryDownload()">Download full weekly diary</button></p>`}
function diaryMarkup(){if(!diaryData)diaryLoad();return `<h2>Weekly Diary Card</h2><p>Daily check-ins, a seven-day skills checklist and a paper-style weekly review. Entries stay in this browser unless you download them.</p><div class="card diary-week"><button onclick="diaryShiftWeek(-1)" aria-label="Previous week">←</button><strong>${diaryDateLabel()}</strong><button onclick="diaryShiftWeek(1)" aria-label="Next week">→</button></div><div class="diary-tabs"><button class="${diaryPage==='daily'?'primary':''}" onclick="diarySwitch('daily')">Daily tracking</button><button class="${diaryPage==='skills'?'primary':''}" onclick="diarySwitch('skills')">Skills checklist</button><button class="${diaryPage==='review'?'primary':''}" onclick="diarySwitch('review')">Weekly review</button></div>${diaryPage==='daily'?diaryDailyMarkup():diaryPage==='skills'?diarySkillsMarkup():diaryReviewMarkup()}<p class="muted"><small>Browser data isn't encrypted or backed up. Download important records and keep them somewhere private. This is a self-help tool, not crisis monitoring.</small></p>`}
function diarySave(){diaryAutoSave();showSaveToast('✓ Weekly diary saved! Find it under My Saved Work.')}
function diaryExport(){let out=['DBT Companion — Weekly Diary','Week: '+diaryDateLabel(),'','DAILY TRACKING'];for(let i=0;i<7;i++){out.push('\n'+diaryDays[i]);for(let [k,label] of diaryFields)out.push(label+': '+(diaryData.days[i][k]??'Not entered'))}out.push('\nSKILLS CHECKLIST');for(let [group,skills] of diarySkills){out.push('\n'+group);for(let skill of skills)out.push(skill+': '+diaryDays.filter((d,i)=>diaryData.skills[skill]?.[i]).join(', '))}out.push('\nBEFORE AND AFTER');for(let i=0;i<7;i++){let entry=diaryData.beforeAfter[i]||{};if(i===0){for(let [k,v] of Object.entries(diaryData.beforeAfter))if(typeof v==='string'&&entry[k]===undefined)entry[k]=v}out.push('\n'+diaryDays[i]);for(let [k,v] of Object.entries(entry))if(typeof v==='string'&&v.trim())out.push(k+': '+v)}out.push('\nWEEKLY NOTES\n'+(diaryData.notes||''));return out.join('\n')}
function diaryDownload(){diaryAutoSave();downloadText('dbt-weekly-diary-'+diaryWeekKey()+'.txt',diaryExport());showSaveToast('Download requested. Check Downloads and confirm any browser prompt.')}
function diarySavedCards(){let keys=Object.keys(diaryStore).sort().reverse();return `<h2>Saved diary weeks</h2>${keys.length?keys.map(key=>`<div class="card"><h3>Week of ${escapeHTML(key)}</h3><p class="muted">${escapeHTML(diaryStore[key].updated?new Date(diaryStore[key].updated).toLocaleString():'Saved')}</p><button class="primary" onclick="diaryOpen('${key}')">Open & edit</button> <button onclick="diaryDownloadSaved('${key}')">Download</button> <button onclick="diaryDelete('${key}')">Delete</button></div>`).join(''):'<p>No weekly diaries saved yet.</p>'}`}
function diaryOpen(key){diaryWeek=new Date(key+'T12:00:00');diaryLoad();diaryPage='review';go('Diary Card')}
function diaryDownloadSaved(key){let old=diaryWeek,oldData=diaryData;diaryWeek=new Date(key+'T12:00:00');diaryLoad();diaryDownload();diaryWeek=old;diaryData=oldData}
function diaryDelete(key){if(!confirm('Delete the saved diary for '+key+'? Download it first if needed.'))return;delete diaryStore[key];try{localStorage.setItem('dbt-companion-diary-v14',JSON.stringify(diaryStore));if(diaryWeekKey()===key)diaryLoad();render();showSaveToast('Saved diary deleted.')}catch(e){showSaveToast('Could not delete saved diary.',true)}}


// Version 1.8: portable backup and restore. Explicit user action only.
const BACKUP_KEYS=['dbt-companion-theme','dbt-companion-chains-v11','dbt-companion-practice-v09','dbt-companion-practice-dates','dbt-companion-diary-v14'];
const backupPanel=()=>`<div class="card guide-teal" id="backup-panel"><h3>Backup & Restore — v1.8</h3><p>Keep your diary weeks, chain analyses, skills practice drafts and theme preference together in one JSON backup file. This includes sensitive personal information. Store it privately.</p><p><button class="primary" type="button" onclick="exportAllBackup()">Download complete backup</button></p><label for="backup-upload">Restore from a DBT Companion backup (.json)</label><input id="backup-upload" type="file" accept=".json,application/json" onchange="prepareBackupRestore(this)"/><div id="backup-restore-preview" role="status" aria-live="polite"></div><p class="muted"><small>Restore replaces the saved diary, chain, and practice collections in this browser after your confirmation. Download a backup of current work first. A backup is not encrypted, and downloads may remain on your device or in cloud-synced folders. Journal and Reflection Jar text that was never saved in the app cannot be backed up.</small></p></div>`;
const originalSavedWorkMarkup=savedWorkMarkup;
savedWorkMarkup=function(){return originalSavedWorkMarkup()+backupPanel()};
const originalPrivacyGuideMarkup=privacyGuideMarkup;
privacyGuideMarkup=function(){return originalPrivacyGuideMarkup()+`<div class="card guide-teal"><h3>Moving to a new version or phone</h3><p>Open <b>My Saved Work</b> and tap <b>Download complete backup</b>. Keep the downloaded JSON file private. In the new app, open <b>My Saved Work</b>, choose that file under Restore, review the preview and confirm. Your old browser data will not transfer by itself.</p><p>Backup files contain readable mental-health entries; they are not encrypted. Do not email or share them casually. Test the restored entries before deleting the old copy.</p></div>`};
function exportAllBackup(){
 try{
  const records={};
  for(const key of BACKUP_KEYS){const value=localStorage.getItem(key);if(value!==null)records[key]=value;}
  const payload={app:'DBT Companion',format:'dbt-companion-backup',version:1,created:new Date().toISOString(),records};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dbt-companion-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
  showSaveToast('Backup download requested. Check Downloads and keep the JSON file private.');
 }catch(e){showSaveToast('Backup could not be created. Your saved work has not changed.',true)}
}
let pendingBackup=null;
async function prepareBackupRestore(input){
 const preview=document.getElementById('backup-restore-preview');pendingBackup=null;preview.textContent='';
 const file=input.files&&input.files[0];if(!file)return;
 if(file.size>5*1024*1024){preview.textContent='File too large (5 MB maximum). No changes made.';return;}
 try{
  const parsed=JSON.parse(await file.text());
  if(parsed.app!=='DBT Companion'||parsed.format!=='dbt-companion-backup'||parsed.version!==1||!parsed.records||typeof parsed.records!=='object'||Array.isArray(parsed.records))throw Error('Not a supported DBT Companion backup.');
  const records=parsed.records;
  if(Object.keys(records).some(k=>!BACKUP_KEYS.includes(k)))throw Error('Unexpected backup fields.');
  for(const [k,v] of Object.entries(records)){
   if(typeof v!=='string')throw Error('Invalid saved data.');
   if(k==='dbt-companion-theme'){if(!['light','dark'].includes(v))throw Error('Invalid theme.');}
   else {const obj=JSON.parse(v);if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('Invalid saved collection.');}
  }
  pendingBackup=records;
  const count=k=>{try{return Object.keys(JSON.parse(records[k]||'{}')).length}catch(e){return 0}};
  preview.innerHTML=`<p><b>Backup ready to review:</b> ${count('dbt-companion-diary-v14')} diary week(s), ${count('dbt-companion-chains-v11')} chain analysis draft(s), ${count('dbt-companion-practice-v09')} practice draft(s).</p><p><b>Warning:</b> restoring replaces the current saved collections, including collections absent from this backup. Back up current work first.</p><button type="button" class="primary" onclick="confirmBackupRestore()">Confirm restore</button> <button type="button" onclick="cancelBackupRestore()">Cancel</button>`;
 }catch(e){preview.textContent='Could not read this backup: '+e.message+' No changes made.';input.value='';}
}
function cancelBackupRestore(){pendingBackup=null;const p=document.getElementById('backup-restore-preview');if(p)p.textContent='Restore canceled. Nothing changed.';const i=document.getElementById('backup-upload');if(i)i.value=''}
function confirmBackupRestore(){
 if(!pendingBackup)return;
 if(!confirm('Replace this browser’s saved diary weeks, chain analyses, and practice drafts with the selected backup? Download a backup of current work first.'))return;
 const before={};
 try{
  for(const key of BACKUP_KEYS)before[key]=localStorage.getItem(key);
  for(const key of BACKUP_KEYS){if(Object.prototype.hasOwnProperty.call(pendingBackup,key))localStorage.setItem(key,pendingBackup[key]);else localStorage.removeItem(key);}
  for(const key of BACKUP_KEYS){const expected=Object.prototype.hasOwnProperty.call(pendingBackup,key)?pendingBackup[key]:null;if(localStorage.getItem(key)!==expected)throw Error('Storage verification failed');}
  chainDrafts=JSON.parse(localStorage.getItem('dbt-companion-chains-v11')||'{}');practiceDrafts=JSON.parse(localStorage.getItem('dbt-companion-practice-v09')||'{}');diaryStore=JSON.parse(localStorage.getItem('dbt-companion-diary-v14')||'{}');activeChainId=null;diaryLoad();setTheme(localStorage.getItem('dbt-companion-theme')||'light');pendingBackup=null;render();showSaveToast('✓ Backup restored. Check My Saved Work and Diary Card.');
 }catch(e){
  try{for(const key of BACKUP_KEYS){if(before[key]===null)localStorage.removeItem(key);else if(before[key]!==undefined)localStorage.setItem(key,before[key]);}}catch(rollbackError){}
  showSaveToast('Restore failed. Previous browser data was restored where possible; please verify your entries.',true);
 }
}

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch(() => {}); });
}

render();</script></body></html>
